<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Álbum de Pássaros do Cerrado</title>
  <link rel="stylesheet" href="style.css?v=2">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
</head>
<body>

  <!-- Tela inicial: capa com fotos de aves -->
  <section class="tela-capa" id="telaCapa">

    <!-- Aves decorativas espalhadas pela capa (cantos) -->
    <div class="ave-deco ave-deco-1" style="background-image: url('banco-aves/arara-azul-grande.jpg');"></div>
    <div class="ave-deco ave-deco-2" style="background-image: url('banco-aves/tucano-toco.jpg');"></div>
    <div class="ave-deco ave-deco-3" style="background-image: url('banco-aves/curicaca.jpg');"></div>
    <div class="ave-deco ave-deco-4" style="background-image: url('banco-aves/ema.jpg');"></div>
    <div class="ave-deco ave-deco-5" style="background-image: url('banco-aves/papagaio-verdadeiro.jpg');"></div>
    <div class="ave-deco ave-deco-6" style="background-image: url('banco-aves/coruja-buraqueira.jpg');"></div>

    <div class="capa-conteudo">

      <p class="capa-orelha">Pesquisa Unesp · Cornell</p>

      <h1 class="capa-titulo">
        <span class="t-pequeno">Meu álbum de</span>
        <span class="t-grande">PÁSSAROS</span>
        <span class="t-pequeno">do</span>
        <span class="t-grande">CERRADO</span>
      </h1>

      <div class="ornamento-divider">
        <span class="o-line"></span>
        <span class="o-dot"></span>
        <span class="o-line"></span>
      </div>

      <p class="subtitulo">Uma viagem com asas pelo coração do Brasil</p>

      <div class="foto-capa-rica">
        <div class="foto-imagem" style="background-image: url('banco-aves/seriema.jpg');"></div>
        <p class="foto-legenda">Seriema · símbolo do cerrado</p>
      </div>

      <div class="bloco-nome">
        <label for="inputNome">Qual é o seu nome?</label>
        <input type="text" id="inputNome" placeholder="Escreva aqui..." value="Luiza" autocomplete="off">
        <button class="btn-comecar" id="btnComecar">
          <span>Começar minha jornada</span>
          <span class="seta">→</span>
        </button>
      </div>

      <div class="capa-rodape">
        <span class="selo-mockup">MOCKUP — PROJETO EM DESENVOLVIMENTO</span>
        <span class="capa-credito">Desenvolvido por <strong>Ylvorix Digital Ltda</strong></span>
      </div>
    </div>
  </section>

  <!-- App principal (sidebar + páginas) -->
  <main class="app" id="app">

    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>BANCO DE FIGURINHAS</h2>
        <p>Arraste a foto certa para cada pássaro</p>
      </div>
      <div class="sidebar-busca">
        <input type="text" id="busca" placeholder="🔍 procurar pássaro...">
      </div>
      <div class="banco-aves" id="bancoAves"></div>
    </aside>

    <section class="principal">
      <div class="topbar">
        <div class="topbar-info">
          <span class="ola">Olá, <strong id="nomeUsuario">amiga</strong>!</span>
        </div>
        <div class="nav-paginas">
          <button id="btnAnt" title="Página anterior">←</button>
          <span class="indicador" id="indicador">1 / 15</span>
          <button id="btnProx" title="Próxima página">→</button>
        </div>
        <button class="btn-imprimir" id="btnImprimir">🖨️ Imprimir álbum</button>
      </div>

      <div class="stage" id="stage"></div>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <script src="aves.js?v=2"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
