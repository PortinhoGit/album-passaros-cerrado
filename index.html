<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Álbum de Pássaros do Cerrado</title>
  <link rel="stylesheet" href="style.css?v=2">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
</head>
<body>

  <!-- Tela inicial: capa simples com grade de aves -->
  <section class="tela-capa" id="telaCapa">
    <div class="capa-wrap">

      <p class="capa-eyebrow">Pesquisa Unesp · Cornell</p>
      <h1 class="capa-h1">Meu Álbum de Pássaros do Cerrado</h1>
      <p class="capa-sub">Uma viagem com asas pelo coração do Brasil</p>

      <div class="grade-aves">
        <img src="banco-aves/seriema.jpg" alt="Seriema">
        <img src="banco-aves/arara-azul-grande.jpg" alt="Arara-azul">
        <img src="banco-aves/tucano-toco.jpg" alt="Tucano-toco">
        <img src="banco-aves/curicaca.jpg" alt="Curicaca">
        <img src="banco-aves/ema.jpg" alt="Ema">
        <img src="banco-aves/papagaio-verdadeiro.jpg" alt="Papagaio">
      </div>

      <div class="capa-form">
        <label for="inputNome">Qual é o seu nome?</label>
        <input type="text" id="inputNome" value="Luiza" autocomplete="off">
        <button class="btn-comecar" id="btnComecar">Começar minha jornada</button>
      </div>

      <p class="capa-foot">
        <span class="capa-mockup">MOCKUP — PROJETO EM DESENVOLVIMENTO</span><br>
        Desenvolvido por <strong>Ylvorix Digital Ltda</strong>
      </p>
    </div>
  </section>

  <!-- App principal (sidebar + páginas) -->
  <main class="app" id="app">

    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>BANCO DE FIGURINHAS</h2>
        <p>Arraste a foto certa para cada pássaro</p>
      </div>
      <div class="sidebar-busca">
        <input type="text" id="busca" placeholder="🔍 procurar pássaro...">
      </div>
      <div class="banco-aves" id="bancoAves"></div>
    </aside>

    <section class="principal">
      <div class="topbar">
        <div class="topbar-info">
          <span class="ola">Olá, <strong id="nomeUsuario">amiga</strong>!</span>
        </div>
        <div class="nav-paginas">
          <button id="btnAnt" title="Página anterior">←</button>
          <span class="indicador" id="indicador">1 / 15</span>
          <button id="btnProx" title="Próxima página">→</button>
        </div>
        <button class="btn-imprimir" id="btnImprimir">🖨️ Imprimir álbum</button>
      </div>

      <div class="stage" id="stage"></div>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <script src="aves.js?v=2"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
